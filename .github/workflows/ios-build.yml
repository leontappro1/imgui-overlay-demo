name: Build iOS overlay

# macOS runners are hosted by GitHub, so this builds an iOS app from Windows:
# push this folder to GitHub -> Actions -> download the artifact.
# No Mac and no Apple account needed for the simulator job.

on:
  workflow_dispatch:
    inputs:
      signed_device:
        description: 'Also try a SIGNED device build (needs the secrets below)'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  # ------------------------------------------------------------------ always works
  simulator:
    name: Simulator .ipa (unsigned, no account needed)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Build + pack
        working-directory: ios
        run: bash build_sim.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgui-overlay-ios-simulator-ipa
          path: ios/out/*.ipa
          if-no-files-found: error

  # ------------------------------------------------------------------ opt-in, needs secrets
  # Required repository secrets / variables:
  #   IOS_CERT_P12_BASE64  - Apple Distribution/Development .p12, base64
  #   IOS_CERT_PASSWORD    - password for that .p12
  #   IOS_PROVISION_BASE64 - .mobileprovision, base64
  #   IOS_TEAM_ID          - e.g. ABCDE12345
  #   IOS_BUNDLE_ID        - repository variable, e.g. com.maksim.imguioverlay
  # Paid Apple Developer Program membership is required for Ad Hoc / App Store export.
  device:
    name: Signed device .ipa
    if: ${{ github.event.inputs.signed_device == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROV_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$RUNNER_TEMP" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          echo "$PROV_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Archive and export signed .ipa
        working-directory: ios
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST

          cmake -S . -B build-device -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DDEV_TEAM="$TEAM_ID" \
            -DBUNDLE_ID="$BUNDLE_ID"

          xcodebuild \
            -project build-device/ImGuiOverlayIOS.xcodeproj \
            -scheme ImGuiOverlayIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ImGuiOverlay.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ImGuiOverlay.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgui-overlay-ios-device-ipa
          path: ios/build/ipa/*.ipa
          if-no-files-found: error
